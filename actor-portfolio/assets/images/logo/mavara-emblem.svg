<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="mavaraEmblemTitle">
  <title id="mavaraEmblemTitle">نشان خانه ماورا</title>
  <defs>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263A5C" />
      <stop offset="100%" stop-color="#141F35" />
    </linearGradient>
  </defs>

  <!-- هلال ماه -->
  <path d="M100 18
           a82 82 0 1 0 0 164
           a66 66 0 1 1 0 -164 Z"
        fill="url(#moonGradient)" />

  <!-- کمان طلایی دورتادور -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#C9A25D" stroke-width="2.5"
          stroke-dasharray="4 340" stroke-linecap="round" transform="rotate(-40 100 100)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#C9A25D" stroke-width="2.5"
          stroke-dasharray="180 340" stroke-linecap="round" transform="rotate(40 100 100)" opacity="0.7" />

  <!-- ستاره کوچک -->
  <path d="M62 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#D9B879" />

  <!-- نیم‌رخ ساده -->
  <path d="M96 54
           c10 0 17 8 17 18
           c0 6 -3 10 -3 14
           l6 4 -5 3 1 6 -6 2
           c-1 6 -6 10 -12 10
           c-9 0 -16 -7 -16 -16
           l0 -18
           c0 -13 8 -23 18 -23 Z"
        fill="none" stroke="#F3C98A" stroke-width="1.6" stroke-linejoin="round" opacity="0.9" />

  <!-- پیکره نشسته -->
  <path d="M84 128
           c0 -8 7 -14 16 -14
           s16 6 16 14
           l4 20 -40 0 Z"
        fill="#141F35" />
  <circle cx="100" cy="108" r="8" fill="#141F35" />
</svg>
