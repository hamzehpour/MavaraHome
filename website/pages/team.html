<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعضای خانه ماورا | خانه‌ی ماورا</title>
<meta name="description" content="آشنایی با اعضای خانه ماورا">
<link rel="icon" type="image/webp" href="../assets/images/logo/favicon.webp">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;max-width:960px;margin:0 auto}
  .team-card{background:var(--card-bg,#fff);border-radius:16px;padding:20px;text-align:center;cursor:pointer;transition:transform .2s;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .team-card:hover{transform:translateY(-4px)}
  .team-card img{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:12px}
  .team-card .ph-fallback{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;background:var(--navy,#1b2340);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
  .team-detail{max-width:640px;margin:0 auto;text-align:center}
  .team-detail img{width:150px;height:150px;border-radius:50%;object-fit:cover;margin-bottom:16px}
</style>
</head>
<body data-page="team">
<div id="header"></div>
<main class="section"><div class="container" id="teamRoot">
  <p style="text-align:center;color:var(--text-muted)">در حال بارگذاری...</p>
</div></main>
<div id="footer"></div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/resume.js"></script>
<script>
loadHeader('team.html'); loadFooter();

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function renderTeam() {
  const root = document.getElementById('teamRoot');
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');

  if (slug) {
    try {
      const m = await API.team.bySlug(slug);
      const isEn = lang() === 'en';
      // Schema v18: this branch now carries the same "mv*"-id skeleton
      // about-mansour.html uses, rendered by the shared MavaraResume
      // module (assets/js/resume.js) — profile + links list (replacing
      // the old fixed telegram/instagram buttons) + category-grouped
      // resume + samples tab + project modal + fullscreen gallery viewer.
      root.innerHTML = `
        <a href="team.html" style="display:inline-block;margin-bottom:18px;color:var(--gold,#c8a24a)">${isEn ? '← Back to team' : '← بازگشت به اعضا'}</a>
        <section class="resume-container resume-profile-section">
          <div class="resume-bio" data-reveal>
            <div class="resume-bio-photo-wrap"><img id="mvProfilePhoto" src="" alt="" loading="lazy"></div>
            <div class="resume-bio-text" id="mvBioText">
              <p class="eyebrow" id="mvEyebrow"></p>
              <h1 id="mvTitle"></h1>
              <p class="role" id="mvSub"></p>
              <p id="mvBioP"></p>
              <button class="bio-more" id="mvBioMore" type="button" aria-expanded="false"><span data-i18n="bio_more">بیشتر</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
              <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap" id="mvLinksProfile"></div>
            </div>
          </div>
        </section>
        <div class="divider"></div>
        <section class="resume-container" id="mvResumeList"></section>
        <div class="divider"></div>
        <section class="section">
          <div class="section-head"><h2 class="section-title" data-i18n="samples_title">نمونه کارها</h2></div>
          <div class="samples-tabs" id="mvSamplesTabs">
            <button class="samples-tab-btn active" data-tab="all" data-i18n="tab_all">همه</button>
            <button class="samples-tab-btn" data-tab="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span data-i18n="tab_photo">عکس</span></button>
            <button class="samples-tab-btn" data-tab="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg><span data-i18n="tab_video">ویدیو</span></button>
          </div>
          <div class="samples-gallery" id="mvSamplesGallery"></div>
        </section>
        <div class="modal-overlay" id="mvModal" style="display:none">
          <div class="modal">
            <div class="modal-header"><h3 id="mvModalTitle"></h3><button class="modal-close" onclick="MavaraResume.closeModal()" aria-label="close">✕</button></div>
            <div class="modal-body" id="mvModalBody"></div>
          </div>
        </div>
        <div class="viewer-overlay" id="mvViewer" style="display:none" onclick="this.style.display='none'">
          <button type="button" id="mvViewerPrev" class="viewer-nav viewer-nav--prev" onclick="event.stopPropagation(); MavaraResume.viewerStep(-1)" aria-label="previous" style="display:none">‹</button>
          <img id="mvViewerImg" src="" alt="" style="display:none">
          <video id="mvViewerVideo" controls style="display:none"></video>
          <button type="button" id="mvViewerNext" class="viewer-nav viewer-nav--next" onclick="event.stopPropagation(); MavaraResume.viewerStep(1)" aria-label="next" style="display:none">›</button>
        </div>`;
      applyLang(); // translate the data-i18n labels just injected (bio_more, samples_title, ...)
      MavaraResume.mount(m);
    } catch {
      root.innerHTML = `<p style="text-align:center">این عضو یافت نشد. <a href="team.html">بازگشت</a></p>`;
    }
    return;
  }

  const members = await API.team.all();
  if (!members.length) {
    root.innerHTML = `<p style="text-align:center;color:var(--text-muted)">${lang() === 'en' ? 'No team members yet.' : 'هنوز عضوی ثبت نشده است.'}</p>`;
    return;
  }
  const isEn = lang() === 'en';
  root.innerHTML = `
    <section class="hero" style="padding:20px 0 34px">
      <p class="eyebrow">${isEn ? 'The people behind Mavara' : 'همراهان خانه ماورا'}</p>
      <h1>${isEn ? 'Our Team' : 'اعضای خانه ماورا'}</h1>
    </section>
    <div class="team-grid">
      ${members.map(m => {
        const name = isEn && m.full_name_en ? m.full_name_en : m.full_name;
        const role = isEn && m.role_title_en ? m.role_title_en : m.role_title;
        return `<a class="team-card" href="team.html?slug=${encodeURIComponent(m.slug)}" style="text-decoration:none;color:inherit;display:block">
          ${m.photo ? `<img src="/${m.photo}" alt="${esc(name)}">` : `<div class="ph-fallback">${esc((name||'?')[0])}</div>`}
          <div style="font-weight:700">${esc(name)}</div>
          ${role ? `<div style="color:var(--text-muted);font-size:13px;margin-top:4px">${esc(role)}</div>` : ''}
        </a>`;
      }).join('')}
    </div>`;
}
API.init().then(renderTeam);
window.addEventListener('mv-lang', renderTeam);
</script>
</body>
</html>
