<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مدیریت رزروها</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/webp" href="../../assets/images/logo/favicon.webp"><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar"><div style="font-weight:700;font-size:15px;padding:8px 14px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1)">خانه ماورا</div><a href="dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>داشبورد</a><a href="events.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 5h16"/><path d="M4 5 3 21M20 5l1 16"/><path d="M8 5v16M12 5v16M16 5v16"/></svg>رویدادها</a><a href="reservations.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/></svg>رزروها</a><a href="waitlist.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>لیست انتظار</a><a href="broadcast.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>اطلاع‌رسانی</a><a href="checkin.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>پذیرش بلیت</a><a href="portfolio.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20"/></svg>رزومه</a><a href="team.html">اعضای خانه ماورا</a><a href="settings.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>تنظیمات</a><button onclick="MavaraTheme.toggle(); this.textContent = MavaraTheme.get()==='dark' ? '☀️ حالت روشن' : '🌙 حالت تیره'" id="themeToggleBtn" style="margin-top:auto">🌓 تغییر پوسته</button>
        <button onclick="logout()" style="margin-top:auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>خروج</button></aside>
    <main class="admin-main">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
            <div><h2>مدیریت رزروها</h2><p style="color:var(--text-muted);font-size:13px;margin-top:4px">هم رزروهای سایت هم تلگرام، در یک لیست — وضعیت‌ها با ربات تلگرام یکسان است</p></div>
            <button class="btn btn--outline" style="font-size:12px" onclick="exportCsv()">خروجی Excel (CSV)</button>
        </div>
        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
            <input id="search" placeholder="جستجو: نام، تلفن، کد رزرو..." oninput="render()" style="flex:1;min-width:220px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit">
            <select id="statusFilter" onchange="render()" style="padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit"><option value="all">همه وضعیت‌ها</option></select>
            <select id="filter" onchange="render()" style="padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit"><option value="all">همه رویدادها</option></select>
        </div>
        <div id="stats" style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:var(--text-muted)"></div>
        <div id="bulkBar" style="display:none;align-items:center;gap:10px;background:var(--bg-soft);padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px">
            <span id="bulkCount"></span>
            <button class="btn btn--gold" style="font-size:11.5px;padding:5px 12px" onclick="bulkApprove()">✅ تأیید همه‌ی انتخاب‌شده‌ها</button>
            <button class="btn btn--outline" style="font-size:11.5px;padding:5px 12px" onclick="clearSelection()">لغو انتخاب</button>
        </div>
        <table class="admin-table"><thead><tr><th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th><th>کد</th><th>نام</th><th>تماس</th><th>رویداد</th><th>تعداد</th><th>مبلغ</th><th>وضعیت</th><th>رسید</th><th>عملیات</th></tr></thead><tbody id="tbody"></tbody></table>
    </main>
</div>
<script src="../../assets/js/app.js"></script>
<script>
if (!API.auth.check()) window.location.href = 'login.html';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let events = [];
let allReservations = [];
// Same status vocabulary the bot's state machine uses — see
// bot/services/reservation_service.py.
const statusLabels = { pending_payment:'در انتظار پرداخت', pending_review:'رسید ارسال شده — منتظر تأیید', needs_correction:'نیازمند اصلاح ✏️', awaiting_buyer_confirmation:'در انتظار پاسخ خریدار (رد شده)', approved:'تأیید شده', rejected:'رد شده', cancelled:'لغو شده', expired:'منقضی شده', used:'استفاده شده', waiting:'لیست انتظار' };
const STATUS_ORDER = Object.keys(statusLabels);
async function init(){
  await API.init(); events = API.events.all();
  const ssel = document.getElementById('statusFilter');
  STATUS_ORDER.forEach(k => ssel.insertAdjacentHTML('beforeend', `<option value="${k}">${statusLabels[k]}</option>`));
  const sel = document.getElementById('filter');
  events.forEach(e => sel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${esc(e.title)}</option>`));
  await reload();
}
async function reload(){
  allReservations = await API.reservations.allAdmin();
  render();
}
function filtered(){
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const f = document.getElementById('filter').value;
  return allReservations.filter(r =>
    (f === 'all' || String(r.event_id) === f) &&
    (st === 'all' || r.status === st) &&
    (!q || (r.buyer_name || '').toLowerCase().includes(q) || String(r.buyer_phone || '').toLowerCase().includes(q) || String(r.reservation_code || '').toLowerCase().includes(q))
  );
}
function render(){
  const rows = filtered();
  const pending = rows.filter(r => r.status === 'pending_review').length;
  const total = rows.filter(r => r.status === 'approved').reduce((s, r) => s + Number(r.total_price || 0), 0);
  document.getElementById('stats').innerHTML = `<span>نمایش: ${rows.length} رزرو</span><span>منتظر تأیید: <strong style="color:var(--gold-deep)">${pending}</strong></span><span>مبلغ تأییدشده: <strong style="color:var(--gold-deep)">${total.toLocaleString('fa-IR')} تومان</strong></span>`;
  document.getElementById('tbody').innerHTML = rows.map(r => {
    const canDecide = r.status === 'pending_review';
    // A receipt only exists once the buyer actually submitted one
    // (pending_review or later) AND the booking came from the website —
    // a Telegram-submitted receipt is a Telegram file_id, viewed inside
    // Telegram itself, not through this admin-only endpoint.
    const hasReceipt = r.source === 'website' && r.status !== 'pending_payment';
    return `<tr>
      <td>${canDecide ? `<input type="checkbox" class="rowCheck" value="${r.id}" onchange="updateSelection()" ${selectedIds.has(r.id) ? 'checked' : ''}>` : ''}</td>
      <td dir="ltr" style="font-size:11px;color:var(--gold-deep);font-weight:600">${esc(r.reservation_code || '#' + r.id)}</td>
      <td>${esc(r.attendee_name || r.buyer_name || '—')}${r.source === 'website' ? ' <span style="font-size:10px;color:var(--text-muted)">(سایت)</span>' : ' <span style="font-size:10px;color:var(--text-muted)">(تلگرام)</span>'}</td>
      <td dir="ltr" style="font-size:12px">${esc(r.attendee_phone || r.buyer_phone || '—')}</td>
      <td>${esc(r.event_title || r.event_id)}<br><span style="font-size:10.5px;color:var(--text-muted)" dir="ltr">${esc(r.session_date || '')} ${esc(r.session_time || '')}</span></td>
      <td>${r.people}</td><td>${Number(r.total_price || 0).toLocaleString('fa-IR')}</td>
      <td><span class="badge">${statusLabels[r.status] || r.status}</span>${r.status === 'needs_correction' && r.admin_note ? `<br><span style="font-size:10px;color:var(--text-muted)">${esc(r.admin_note)}</span>` : ''}</td>
      <td>${hasReceipt ? `<button class="btn btn--outline btn--sm" style="font-size:10.5px;padding:4px 10px" onclick="viewReceipt(${r.id})">👁️ مشاهده</button>` : '<span style="font-size:11px;color:var(--text-muted)">—</span>'}</td>
      <td style="white-space:nowrap">
        ${canDecide ? `<button class="btn btn--gold" style="font-size:10.5px;padding:4px 10px" onclick="approve(${r.id})">تأیید</button>
        <button class="btn btn--outline" style="font-size:10.5px;padding:4px 10px;color:#c44" onclick="reject(${r.id})">رد</button>
        <button class="btn btn--outline" style="font-size:10.5px;padding:4px 10px" onclick="needsCorrection(${r.id})">نیازمند اصلاح</button>` : '<span style="font-size:11px;color:var(--text-muted)">—</span>'}
      </td></tr>`;
  }).join('') || '<tr><td colspan="10">رزروی یافت نشد.</td></tr>';
  updateSelection();
}

let selectedIds = new Set();
function toggleSelectAll(checkbox) {
  document.querySelectorAll('.rowCheck').forEach(cb => { cb.checked = checkbox.checked; if (checkbox.checked) selectedIds.add(Number(cb.value)); else selectedIds.delete(Number(cb.value)); });
  updateSelection();
}
function updateSelection() {
  document.querySelectorAll('.rowCheck:checked').forEach(cb => selectedIds.add(Number(cb.value)));
  document.querySelectorAll('.rowCheck:not(:checked)').forEach(cb => selectedIds.delete(Number(cb.value)));
  const bar = document.getElementById('bulkBar');
  if (selectedIds.size > 0) {
    bar.style.display = 'flex';
    document.getElementById('bulkCount').textContent = `${selectedIds.size} رزرو انتخاب شده`;
  } else {
    bar.style.display = 'none';
  }
}
function clearSelection() {
  selectedIds = new Set();
  document.getElementById('selectAll').checked = false;
  render();
}
async function bulkApprove() {
  if (!selectedIds.size) return;
  if (!confirm(`${selectedIds.size} رزرو تأیید و بلیت صادر شود؟`)) return;
  try {
    const result = await API.reservations.bulkApprove([...selectedIds]);
    const failed = result.results.filter(r => !r.success);
    selectedIds = new Set();
    await reload();
    toast(failed.length ? `${result.results.length - failed.length} تأیید شد، ${failed.length} ناموفق` : `${result.results.length} رزرو با موفقیت تأیید شد`);
  } catch (err) {
    alert('خطا — ' + (err.details || err.message));
  }
}
async function approve(id){
  if (!confirm('این پرداخت تأیید و بلیت صادر شود؟')) return;
  try {
    // Same approve_reservation() the Telegram admin-approve button calls —
    // issues the real ticket/QR, not a separate admin-panel-only action.
    // The customer gets an email too now if they have one on file (see
    // reservation_service.py) — no extra step needed here for that.
    await API.reservations.approve(id);
    await reload(); toast('تأیید شد — بلیت صادر شد');
  } catch (err) {
    alert('خطا — ' + (err.details || err.message));
  }
}
async function reject(id){
  const reason = prompt('دلیل رد (اختیاری)') || '';
  try {
    await API.reservations.reject(id, reason);
    await reload(); toast('رد شد');
  } catch (err) {
    alert('خطا — ' + (err.details || err.message));
  }
}
async function needsCorrection(id){
  // Third action besides approve/reject — for a receipt the admin can't
  // approve as-is (wrong amount, unreadable photo...) but doesn't want to
  // reject outright. The message is required — it's what gets emailed
  // (and DM'd, if the buyer has Telegram) to the buyer, so there must be
  // something concrete to send. No time limit applies once here — see
  // reservation_service.request_correction()'s docstring.
  const message = prompt('توضیح برای خریدار — چه چیزی باید اصلاح شود؟');
  if (!message || !message.trim()) return;
  try {
    await API.reservations.requestCorrection(id, message.trim());
    await reload(); toast('درخواست اصلاح برای خریدار ارسال شد');
  } catch (err) {
    alert('خطا — ' + (err.details || err.message));
  }
}
async function viewReceipt(id) {
  try {
    await API.reservations.viewReceipt(id);
  } catch {
    alert('این رزرو رسیدی از طریق سایت ندارد (یا هنوز آپلود نشده).');
  }
}
function exportCsv(){
  const rows = filtered();
  const head = ['کد', 'نام', 'تماس', 'رویداد', 'تعداد', 'مبلغ', 'وضعیت', 'تاریخ'];
  const lines = rows.map(r => [r.reservation_code || ('#' + r.id), r.attendee_name || r.buyer_name, r.attendee_phone || r.buyer_phone, r.event_title || r.event_id, r.people, r.total_price || 0, statusLabels[r.status] || r.status, r.created_at].join(','));
  const csv = '﻿' + head.join(',') + '\n' + lines.join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'mavara-reservations.csv'; a.click();
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function logout(){ API.auth.logout(); location.href = 'login.html'; }
addEventListener('DOMContentLoaded', init);
</script>
</body></html>
