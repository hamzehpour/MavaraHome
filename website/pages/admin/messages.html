<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>پیام‌های پشتیبانی</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/webp" href="../../assets/images/logo/favicon.webp"><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar"><div style="font-weight:700;font-size:15px;padding:8px 14px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1)">خانه ماورا</div>
        <a href="dashboard.html">داشبورد</a><a href="events.html">رویدادها</a><a href="calendar.html">تقویم و سانس</a><a href="reservations.html">رزروها</a><a href="portfolio.html">رزومه</a><a href="team.html">اعضای خانه ماورا</a><a href="messages.html" class="active">پیام‌ها</a><a href="checkin.html">پذیرش بلیت</a><a href="ticket-template.html">قالب بلیت</a>
        <button onclick="MavaraTheme.toggle(); this.textContent = MavaraTheme.get()==='dark' ? '☀️ حالت روشن' : '🌙 حالت تیره'" id="themeToggleBtn" style="margin-top:auto">🌓 تغییر پوسته</button>
        <button onclick="logout()">🚪 خروج</button></aside>
    <main class="admin-main">
        <h2 style="margin-bottom:18px">پیام‌های پشتیبانی</h2>
        <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
            <div style="flex:1;min-width:240px;max-width:320px">
                <table class="admin-table"><thead><tr><th>مشتری</th><th>آخرین پیام</th></tr></thead><tbody id="threadTb"></tbody></table>
            </div>
            <div style="flex:2;min-width:280px" id="threadPanel">
                <p style="color:var(--text-muted)">یک مکالمه را از فهرست انتخاب کنید.</p>
            </div>
        </div>
    </main>
</div>
<script src="../../assets/js/app.js"></script>
<script>
if (!API.auth.check()) window.location.href = 'login.html';
let activeUserId = null;
let pollTimer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function loadThreads() {
  const threads = await API.messages.adminThreads();
  document.getElementById('threadTb').innerHTML = threads.map(t => `
    <tr style="cursor:pointer${activeUserId === t.user_id ? ';background:rgba(200,162,74,0.12)' : ''}" onclick="openThread(${t.user_id})">
      <td><strong>${esc(t.full_name || t.phone)}</strong>${t.unread_count > 0 ? ` <span style="background:#c44;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px">${t.unread_count}</span>` : ''}</td>
      <td style="font-size:12px;color:var(--text-muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.last_body || '')}</td>
    </tr>`).join('') || '<tr><td colspan="2">هنوز پیامی دریافت نشده.</td></tr>';
}

async function openThread(userId) {
  activeUserId = userId;
  await loadThreads();
  const msgs = await API.messages.adminThread(userId);
  document.getElementById('threadPanel').innerHTML = `
    <div id="msgList" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:10px;background:var(--bg-alt,rgba(0,0,0,0.03));border-radius:10px;margin-bottom:10px"></div>
    <form id="replyForm" style="display:flex;gap:8px">
      <input id="replyBody" placeholder="پاسخ را بنویسید..." style="flex:1" required>
      <button class="btn btn--primary" type="submit">ارسال</button>
    </form>`;
  renderMessages(msgs);
  document.getElementById('replyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('replyBody');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    await API.messages.adminReply(userId, body);
    const fresh = await API.messages.adminThread(userId);
    renderMessages(fresh);
  });
}

function renderMessages(msgs) {
  const list = document.getElementById('msgList');
  if (!list) return;
  list.innerHTML = msgs.map(m => `
    <div style="align-self:${m.sender === 'admin' ? 'flex-start' : 'flex-end'};max-width:75%;background:${m.sender === 'admin' ? 'var(--navy,#1b2340)' : 'rgba(200,162,74,0.18)'};color:${m.sender === 'admin' ? '#fff' : 'inherit'};padding:8px 12px;border-radius:12px;font-size:13.5px">
      ${esc(m.body)}
    </div>`).join('');
  list.scrollTop = list.scrollHeight;
}

function logout() { API.auth.logout(); window.location.href = 'login.html'; }
addEventListener('DOMContentLoaded', () => {
  loadThreads();
  // Simple polling (no websocket infra in this project) — see the
  // Phase 5 checklist note about this being a deliberate, documented
  // trade-off, not an oversight.
  pollTimer = setInterval(() => {
    loadThreads();
    if (activeUserId) API.messages.adminThread(activeUserId).then(renderMessages);
  }, 15000);
});
</script>
</body>
</html>
