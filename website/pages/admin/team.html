<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مدیریت اعضای خانه ماورا</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/webp" href="../../assets/images/logo/favicon.webp"><link rel="stylesheet" href="../../assets/css/styles.css"></head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar"><div style="font-weight:700;font-size:15px;padding:8px 14px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1)">خانه ماورا</div>
        <a href="dashboard.html">داشبورد</a><a href="events.html">رویدادها</a><a href="reservations.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/></svg>رزروها</a><a href="waitlist.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>لیست انتظار</a><a href="checkin.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>پذیرش بلیت</a><a href="portfolio.html">رزومه</a><a href="team.html" class="active">اعضای خانه ماورا</a>
        <button onclick="MavaraTheme.toggle(); this.textContent = MavaraTheme.get()==='dark' ? '☀️ حالت روشن' : '🌙 حالت تیره'" id="themeToggleBtn" style="margin-top:auto">🌓 تغییر پوسته</button>
        <button onclick="logout()">🚪 خروج</button></aside>
    <main class="admin-main">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px"><h2>اعضای خانه ماورا</h2><button class="btn btn--primary" onclick="openTM()" style="font-size:13px">+ عضو جدید</button></div>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">این افراد در صفحه‌ی عمومی «اعضای خانه ماورا» نمایش داده می‌شوند — جدا از صفحه‌ی «درباره‌ی منصور نصیری» که ثابت می‌ماند.</p>
        <table class="admin-table"><thead><tr><th>نام</th><th>سمت</th><th>وضعیت</th><th>ترتیب</th><th>عملیات</th></tr></thead><tbody id="tb"></tbody></table>
    </main>
</div>
<div class="admin-modal-overlay" id="tmModal" style="display:none"><div class="admin-modal"><div class="admin-modal-header"><h3 id="tmTitle">عضو جدید</h3><button onclick="closeTM()">✕</button></div><div class="admin-modal-body">
    <form id="tmForm" onsubmit="saveTM(event)"><input type="hidden" id="tmId">
        <div class="form-row"><div><label>نام فارسی</label><input id="tmName" required></div><div><label>نام انگلیسی</label><input id="tmNameEn"></div></div>
        <div class="form-row"><div><label>سمت فارسی</label><input id="tmRole"></div><div><label>سمت انگلیسی</label><input id="tmRoleEn"></div></div>
        <label>بیوگرافی فارسی</label><textarea id="tmBioFa"></textarea>
        <label>بیوگرافی انگلیسی</label><textarea id="tmBioEn"></textarea>
        <div class="form-row"><div><label>تلفن تماس (اختیاری)</label><input id="tmPhone"></div><div><label>آیدی تلگرام (اختیاری)</label><input id="tmTelegram" placeholder="@username"></div></div>
        <div class="form-row"><div><label>وضعیت</label><select id="tmStatus"><option value="active">فعال (نمایش عمومی)</option><option value="hidden">مخفی</option></select></div><div><label>ترتیب نمایش</label><input id="tmSort" type="number" value="0"></div></div>
        <label>عکس پروفایل</label>
        <input type="file" id="tmPhotoFile" accept="image/*">
        <div id="tmPhotoPreview" style="margin-top:8px"></div>
        <div style="display:flex;gap:8px;margin-top:16px"><button type="submit" class="btn btn--primary">💾 ذخیره</button><button type="button" class="btn btn--outline" onclick="closeTM()">انصراف</button></div>
    </form>
</div></div></div>
<script src="../../assets/js/app.js"></script>
<script>
if (!API.auth.check()) window.location.href = 'login.html';
let tmId = null, tmPhoto = null;
let allMembers = [];

async function load() {
  allMembers = await API.team.adminAll();
  document.getElementById('tb').innerHTML = allMembers.map(m => `<tr>
    <td><strong>${m.full_name}</strong></td><td>${m.role_title || '—'}</td>
    <td>${m.status === 'active' ? '<span style="color:#2a7a2a">● فعال</span>' : '<span style="color:#999">○ مخفی</span>'}</td>
    <td>${m.sort_order}</td>
    <td style="display:flex;gap:6px"><button class="btn btn--outline btn--sm" onclick="editTM(${m.id})" style="font-size:11px;padding:4px 10px">✏️</button><button class="btn btn--outline btn--sm" onclick="delTM(${m.id})" style="font-size:11px;padding:4px 10px;color:#c44">🗑️</button></td>
  </tr>`).join('') || '<tr><td colspan="5">هنوز عضوی ثبت نشده.</td></tr>';
}
function openTM() {
  tmId = null; tmPhoto = null;
  document.getElementById('tmTitle').textContent = 'عضو جدید';
  document.getElementById('tmForm').reset();
  document.getElementById('tmPhotoPreview').innerHTML = '';
  document.getElementById('tmModal').style.display = 'flex';
}
function editTM(id) {
  const m = allMembers.find(x => x.id === id); if (!m) return; tmId = id;
  document.getElementById('tmTitle').textContent = 'ویرایش عضو';
  document.getElementById('tmId').value = m.id;
  document.getElementById('tmName').value = m.full_name || '';
  document.getElementById('tmNameEn').value = m.full_name_en || '';
  document.getElementById('tmRole').value = m.role_title || '';
  document.getElementById('tmRoleEn').value = m.role_title_en || '';
  document.getElementById('tmBioFa').value = m.bio_fa || '';
  document.getElementById('tmBioEn').value = m.bio_en || '';
  document.getElementById('tmPhone').value = m.contact_phone || '';
  document.getElementById('tmTelegram').value = m.contact_telegram || '';
  document.getElementById('tmStatus').value = m.status || 'active';
  document.getElementById('tmSort').value = m.sort_order || 0;
  tmPhoto = m.photo || null;
  document.getElementById('tmPhotoPreview').innerHTML = tmPhoto ? `<img src="/${tmPhoto}" style="max-width:120px;border-radius:8px">` : '';
  document.getElementById('tmModal').style.display = 'flex';
}
async function saveTM(e) {
  e.preventDefault();
  const d = {
    full_name: document.getElementById('tmName').value, full_name_en: document.getElementById('tmNameEn').value,
    role_title: document.getElementById('tmRole').value, role_title_en: document.getElementById('tmRoleEn').value,
    bio_fa: document.getElementById('tmBioFa').value, bio_en: document.getElementById('tmBioEn').value,
    contact_phone: document.getElementById('tmPhone').value, contact_telegram: document.getElementById('tmTelegram').value,
    status: document.getElementById('tmStatus').value, sort_order: Number(document.getElementById('tmSort').value) || 0,
    photo: tmPhoto,
  };
  const btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  try {
    if (tmId) { await API.team.update(tmId, d); } else { await API.team.create(d); }
    closeTM(); await load(); toast('ذخیره شد');
  } catch (err) {
    alert('خطا در ذخیره — ' + (err.details || err.message));
  } finally {
    if (btn) btn.disabled = false;
  }
}
async function delTM(id) {
  if (!confirm('این عضو حذف شود؟')) return;
  await API.team.delete(id); await load(); toast('حذف شد');
}
function closeTM() { document.getElementById('tmModal').style.display = 'none'; }
function logout() { API.auth.logout(); window.location.href = 'login.html'; }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

document.getElementById('tmPhotoFile') && document.getElementById('tmPhotoFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0]; if (!file) return;
  try { tmPhoto = await API.team.uploadMedia(file); document.getElementById('tmPhotoPreview').innerHTML = `<img src="/${tmPhoto}" style="max-width:120px;border-radius:8px">`; toast('عکس آپلود شد'); }
  catch { toast('آپلود ناموفق بود'); }
});
addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
