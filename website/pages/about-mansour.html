<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصور نصیری | رزومه و نمونه کارها | خانه‌ی ماورا</title>
    <meta name="description" content="رزومه و پورتفولیوی هنری منصور نصیری — بازیگر و کارگردان سینما، تئاتر و تلویزیون">
    <link rel="icon" type="image/webp" href="../assets/images/logo/favicon.webp">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="resume">

    <div id="header"></div>

    <!-- Schema v18: this page's data now comes from the team API (fixed
         slug 'mansour-nasiri' — Mansour is a real team_members row, see
         CHANGELOG.md), rendered by the shared MavaraResume module
         (assets/js/resume.js). The "mv*" ids below are the same skeleton
         team.html's ?slug= detail view uses — MavaraResume.mount() only
         fills them in, this page owns the markup. -->
    <main>
        <!-- One compact profile bio — the primary introduction -->
        <section class="resume-container resume-profile-section">
            <div class="resume-bio" data-reveal>
                <div class="resume-bio-photo-wrap"><img id="mvProfilePhoto" src="../assets/images/mansour/m3.jpg" alt="منصور نصیری" loading="lazy"></div>
                <div class="resume-bio-text" id="mvBioText">
                    <p class="eyebrow" id="mvEyebrow"></p>
                    <h1 id="mvTitle"></h1>
                    <p class="role" id="mvSub"></p>
                    <p id="mvBioP"></p>
                    <button class="bio-more" id="mvBioMore" type="button" aria-expanded="false"><span data-i18n="bio_more">بیشتر</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
                    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap" id="mvLinksProfile"></div>
                </div>
            </div>
        </section>

        <div class="divider"></div>

        <!-- Resume List (clickable rows) -->
        <section class="resume-container" id="mvResumeList"></section>

        <!-- Samples Tab -->
        <div class="divider"></div>
        <section class="section">
            <div class="section-head">
                <h2 class="section-title" data-i18n="samples_title">نمونه کارها</h2>
            </div>
            <div class="samples-tabs" id="mvSamplesTabs">
                <button class="samples-tab-btn active" data-tab="all" data-i18n="tab_all">همه</button>
                <button class="samples-tab-btn" data-tab="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span data-i18n="tab_photo">عکس</span></button>
                <button class="samples-tab-btn" data-tab="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/></svg><span data-i18n="tab_video">ویدیو</span></button>
            </div>
            <div class="samples-gallery" id="mvSamplesGallery"></div>
        </section>

        <p class="resume-footer-text" data-i18n="resume_footer">با افتخار، برای دوستداران هنر</p>
    </main>

    <!-- Popup Modal -->
    <div class="modal-overlay" id="mvModal" style="display:none">
        <div class="modal">
            <div class="modal-header"><h3 id="mvModalTitle"></h3><button class="modal-close" onclick="MavaraResume.closeModal()" aria-label="close">✕</button></div>
            <div class="modal-body" id="mvModalBody"></div>
        </div>
    </div>

    <!-- Fullscreen Viewer -->
    <div class="viewer-overlay" id="mvViewer" style="display:none" onclick="this.style.display='none'">
        <button type="button" id="mvViewerPrev" class="viewer-nav viewer-nav--prev" onclick="event.stopPropagation(); MavaraResume.viewerStep(-1)" aria-label="previous" style="display:none">‹</button>
        <img id="mvViewerImg" src="" alt="" style="display:none">
        <video id="mvViewerVideo" controls style="display:none"></video>
        <button type="button" id="mvViewerNext" class="viewer-nav viewer-nav--next" onclick="event.stopPropagation(); MavaraResume.viewerStep(1)" aria-label="next" style="display:none">›</button>
    </div>

    <div id="footer"></div>

    <script src="../assets/js/app.js"></script>
    <!-- legacy-data.js removed: the 31-item resume dataset it held is now
         real backend content (see api/server.py's portfolio endpoints and
         seed_portfolio.py), fully admin-editable instead of hardcoded JS. -->
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/resume.js"></script>
    <script>
    // Mansour Nasiri is a fixed, known team member (slug='mansour-nasiri',
    // backfilled from his old content_mansour_* settings by the schema v18
    // migration — see schema.py) — this page always points at that one
    // slug, unlike team.html's ?slug= detail view.
    async function init() {
        loadHeader('about-mansour.html'); loadFooter();
        await API.init();
        try {
            const res = await API.team.bySlug('mansour-nasiri');
            MavaraResume.mount(res);
        } catch {
            document.getElementById('mvResumeList').innerHTML =
                '<p style="text-align:center;color:var(--text-muted)">این صفحه در دسترس نیست.</p>';
        }
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
