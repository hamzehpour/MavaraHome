<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب من | خانه‌ی ماورا</title>
<meta name="description" content="ورود به حساب کاربری، مشاهده رزروها و بلیت‌ها">
<link rel="icon" type="image/webp" href="../assets/images/logo/favicon.webp">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  .acc-box{max-width:420px;margin:0 auto;background:var(--card-bg,#fff);border-radius:16px;padding:26px;box-shadow:0 2px 14px rgba(0,0,0,.06)}
  .acc-box input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(0,0,0,.15);margin-bottom:12px;font-size:15px}
  .res-card{background:var(--card-bg,#fff);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .msg-bubble{max-width:80%;padding:8px 12px;border-radius:12px;font-size:13.5px;margin-bottom:8px}
</style>
</head>
<body data-page="account">
<div id="header"></div>
<main class="section"><div class="container" id="accRoot" style="max-width:640px">
  <p style="text-align:center;color:var(--text-muted)">در حال بارگذاری...</p>
</div></main>
<div id="footer"></div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/site.js"></script>
<script>
loadHeader(); loadFooter();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const STATUS_FA = {
  pending_payment: 'در انتظار پرداخت', pending_review: 'در انتظار بررسی', approved: 'تأییدشده',
  rejected: 'رد شده', awaiting_buyer_confirmation: 'در انتظار تأیید شما', waiting_list: 'لیست انتظار',
};

function renderLogin() {
  const root = document.getElementById('accRoot');
  root.innerHTML = `
    <section class="hero" style="padding:10px 0 26px"><h1>حساب من</h1><p style="color:var(--text-muted)">با شماره تلفنی که با آن رزرو کرده‌اید وارد شوید</p></section>
    <div class="acc-box">
      <div id="stepPhone">
        <input id="accPhone" placeholder="شماره موبایل (مثلاً 09121234567)" inputmode="tel">
        <button class="btn btn--primary" style="width:100%" onclick="requestOtp()">ارسال کد ورود</button>
      </div>
      <div id="stepOtp" style="display:none"></div>
      <div id="stepLinkRequired" style="display:none"></div>
      <p id="accError" style="color:#c44;font-size:13px;margin-top:10px"></p>
    </div>`;
}

async function requestOtp() {
  const phone = document.getElementById('accPhone').value.trim();
  const errEl = document.getElementById('accError');
  errEl.textContent = '';
  if (!phone) { errEl.textContent = 'شماره موبایل را وارد کنید.'; return; }
  try {
    const result = await API.customerAuth.requestOtp(phone);
    if (result.channel === 'telegram') {
      document.getElementById('stepPhone').style.display = 'none';
      document.getElementById('stepOtp').style.display = 'block';
      document.getElementById('stepOtp').innerHTML = `
        <p style="font-size:13.5px;color:var(--text-muted);margin-bottom:10px">کد ۶ رقمی که در تلگرام برایتان ارسال شد را وارد کنید.</p>
        <input id="accCode" placeholder="کد ۶ رقمی" inputmode="numeric" maxlength="6">
        <button class="btn btn--primary" style="width:100%" onclick="verifyOtp('${esc(phone)}')">تأیید و ورود</button>
        <button class="btn btn--outline" style="width:100%;margin-top:8px" onclick="renderLogin()">تغییر شماره</button>`;
    } else if (result.channel === 'link_required') {
      document.getElementById('stepPhone').style.display = 'none';
      document.getElementById('stepLinkRequired').style.display = 'block';
      document.getElementById('stepLinkRequired').innerHTML = `
        <p style="font-size:13.5px;line-height:2;margin-bottom:14px">
          چون این پروژه سرویس پیامک ندارد، کد ورود از طریق ربات تلگرام ارسال می‌شود.
          برای یک‌بار، روی دکمه‌ی زیر بزنید تا حساب شما به تلگرام وصل شود، سپس به این صفحه برگردید
          و دوباره «ارسال کد ورود» را بزنید.
        </p>
        <a class="btn btn--gold" style="width:100%;display:block;text-align:center" href="connect-telegram.html?link=${encodeURIComponent(result.link_token)}">اتصال به تلگرام</a>
        <button class="btn btn--outline" style="width:100%;margin-top:8px" onclick="renderLogin()">بازگشت</button>`;
    }
  } catch (err) {
    errEl.textContent = err.details || err.message || 'خطایی رخ داد.';
  }
}

async function verifyOtp(phone) {
  const code = document.getElementById('accCode').value.trim();
  const errEl = document.getElementById('accError');
  errEl.textContent = '';
  try {
    await API.customerAuth.verifyOtp(phone, code);
    await renderDashboard();
  } catch (err) {
    errEl.textContent = 'کد نادرست است یا منقضی شده — دوباره تلاش کنید.';
  }
}

async function renderDashboard() {
  const root = document.getElementById('accRoot');
  root.innerHTML = `<p style="text-align:center;color:var(--text-muted)">در حال بارگذاری رزروها...</p>`;
  let reservations = [];
  try { reservations = await API.account.reservations(); } catch { /* token might be stale; fall through to empty */ }

  root.innerHTML = `
    <section class="hero" style="padding:10px 0 20px;text-align:${document.dir === 'rtl' ? 'center' : 'center'}">
      <h1>سلام${API.customerAuth.getName() ? '، ' + esc(API.customerAuth.getName()) : ''} 👋</h1>
      <p style="color:var(--text-muted)">${esc(API.customerAuth.getPhone())}</p>
      <button class="btn btn--outline" style="font-size:12px;margin-top:8px" onclick="API.customerAuth.logout(); renderLogin();">خروج از حساب</button>
    </section>
    <h3 style="margin-bottom:10px">رزروهای من</h3>
    <div id="resList">${reservations.length ? reservations.map(reservationCard).join('') : '<p style="color:var(--text-muted)">هنوز رزروی ثبت نکرده‌اید.</p>'}</div>
    <h3 style="margin:26px 0 10px">پیام به پشتیبانی</h3>
    <div class="res-card">
      <div id="msgList" style="display:flex;flex-direction:column;gap:0;max-height:280px;overflow-y:auto;margin-bottom:12px"></div>
      <form id="msgForm" style="display:flex;gap:8px">
        <input id="msgBody" placeholder="پیام خود را بنویسید..." style="flex:1;padding:9px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.15)" required>
        <button class="btn btn--primary" type="submit">ارسال</button>
      </form>
    </div>`;

  document.getElementById('msgForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('msgBody');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    await API.messages.send(body);
    await loadMessages();
  });
  await loadMessages();
  if (window.__msgPoll) clearInterval(window.__msgPoll);
  window.__msgPoll = setInterval(loadMessages, 15000);
}

function reservationCard(r) {
  const status = STATUS_FA[r.status] || r.status;
  const canDownload = r.status === 'approved' && r.reservation_code;
  return `<div class="res-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
      <div>
        <strong>${esc(r.event_title || 'رویداد')}</strong>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px">
          ${esc(r.session_date || '')} ${esc(r.session_time || '')} · ${r.people} نفر
        </div>
      </div>
      <span style="font-size:12px;padding:3px 10px;border-radius:20px;background:${r.status === 'approved' ? 'rgba(42,122,42,.12);color:#2a7a2a' : 'rgba(0,0,0,.06)'}">${esc(status)}</span>
    </div>
    ${r.reservation_code ? `<div style="font-family:monospace;font-size:12.5px;margin-top:8px;color:var(--text-muted)">کد: ${esc(r.reservation_code)}</div>` : ''}
    ${canDownload ? `<a class="btn btn--outline" style="font-size:12px;margin-top:10px" href="${API.account.ticketUrl(r.id)}" target="_blank">📄 دانلود بلیت PDF</a>` : ''}
  </div>`;
}

async function loadMessages() {
  const list = document.getElementById('msgList');
  if (!list) return;
  let msgs = [];
  try { msgs = await API.messages.mine(); } catch { return; }
  list.innerHTML = msgs.map(m => `
    <div style="align-self:${m.sender === 'customer' ? 'flex-end' : 'flex-start'};display:flex">
      <div class="msg-bubble" style="background:${m.sender === 'customer' ? 'rgba(200,162,74,.18)' : 'var(--navy,#1b2340)'};color:${m.sender === 'customer' ? 'inherit' : '#fff'}">${esc(m.body)}</div>
    </div>`).join('') || '<p style="color:var(--text-muted);font-size:13px">هنوز پیامی ندارید. سوالی دارید؟ همینجا بپرسید.</p>';
  list.scrollTop = list.scrollHeight;
}

(async function init() {
  await API.init();
  if (API.customerAuth.check()) {
    await renderDashboard();
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
